{%extends 'myapp/base.html'%}
{%block body_block%}
    <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <div class="col-md-6 ">
                <div class="card shadow-lg mt-5 justify-content-center">
                    <div class="card-header text-white bg-success text-center">
                        <p class="h1">Do You Want To Delete Doctor ?</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-5">
                                <p class="lead">Doctor ID :</p>
                                 <p class="lead">Doctor Name :</p>
                                 <p class="lead">Doctor Desc :</p>
                            </div>
                            <div class="col-md-7">
                                <p class="lead fw-bold">{{doctor.DocterID}}</p>
                                 <p class="lead fw-bold">{{doctor.DoctorName}}</p>
                                 <p class="lead fw-bold">{{doctor.DoctorDesc}}</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <form action="" method="POST">
                            {%csrf_token%}
                             
                            <button class="btn btn-danger btn-md w-100">Yes</button>         
                            <a href="/" class="btn btn-sm btn-success mt-3 w-100">No</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{%endblock%}
