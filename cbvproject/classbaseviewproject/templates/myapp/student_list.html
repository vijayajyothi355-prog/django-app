<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- MDBootstrap 4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.20.0/css/mdb.min.css">
    <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="fontawesome-free-7.1.0-web/fontawesome-free-7.1.0-web/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<p class="h1 text-center">Students List</p>
<div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-md-5">
{%if student_list%}


<table class="table table-striped table-bordered table-hover text-center ">
    <thead class="bg-primary">
<th>Student id</th>
<th>Student Name</th>
<th>Student Marks</th>
    </thead>
    <tbody>
        {%for stu in student_list%}
        
            <tr>
               <td>
                  {{stu.StuID}}
                </td>
                <td>
                      {{stu.StuName}}
               </td>
                 <td>
                     {{stu.StuMarks}}
                 </td>
                     </tr>
        {%endfor%}
                 </tbody>
         
</table>
<div class="btn btn-primary "><a href="/create" class="text-white justify-content-center">Back</a></div>
{%else%}
<p>records not found</p>
{%endif%}
            </div>
        </div>
    </div>
</body>
</html>
