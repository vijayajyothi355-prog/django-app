<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- MDBootstrap 4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.20.0/css/mdb.min.css">
    <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

</head>
<body><div class="container mt-5">
    {%if students%}
    <table  class="table table-bordered table-striped table-hover text-center text-white bg-primary">
                    <thead>
                        <tr class=" ">
                            <th  >
                                Student Id
                            </th>
                            <th>
                                Student Name
                            </th>
                            <th>
                                Student marks
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        {%for stu in students%}
                        <tr>
                            <td>{{stu.stuid}}</td>
                            <td>{{stu.stuname}}</td>
                            <td>{{stu.stumarks}}</td>
                        </tr>
                        {%endfor%}
                    </tbody>
                 </table>
    {%else%}
    <p class="h1 text-danger text-center">records not found</p>
    {%endif%}
</div>
    
</body>
</html>
